disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - force_cast
  - force_try
  - force_unwrapping
  - implicit_getter
  - notification_center_detachment
  - orphaned_doc_comment
  - void_return
  - unused_optional_binding

opt_in_rules:
  - empty_count
  - contains_over_first_not_nil
  - first_where
  - last_where
  - missing_docs
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

excluded:
  - .build
  - Pods
  - Carthage
  - build
  - .github

identifier_name:
  min_length:
    error: 1
  excluded:
    - id
    - URL
    - url
    - vc
    - x
    - y
    - a
    - b
    - i
    - n

reporter: "xcode"
