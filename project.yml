# ==============================================================================
# XcodeGen 项目配置文件
# 用途：通过 YAML 配置动态生成标准 Xcode 项目（.xcodeproj）
# 工具：XcodeGen (https://github.com/yonaskolb/XcodeGen)
# 使用：xcodegen generate
# 注意：版本号由 Info.plist 管理，CI 自动递增，此处不硬编码版本
# ==============================================================================

name: GitHub

options:
  bundleIdPrefix: com.github
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  xcodeVersion: "15.0"
  objectVersion: 60

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: GitHub/Info.plist
    DEVELOPMENT_ASSET_PATHS: "\"GitHub/Preview Content\""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  GitHub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GitHub
        excludes:
          - "Preview Content"
          - "**/README.md"
      - path: GitHub/Preview Content
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.client
        PRODUCT_NAME: GitHub
        INFOPLIST_FILE: GitHub/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: GitHub/GitHub.entitlements
    # 主应用依赖 VPN 扩展，并将其嵌入到 .app 包的 PlugIns 目录中
    # embed: true 确保扩展被复制到 APP 包内，系统才能找到并启动 VPN 扩展
    dependencies:
      - target: VPNPacketTunnel
        embed: true

  # ============================================================================
  # Xray 动态框架 Target
  # 用途：将 Xray Go 静态库封装为动态框架，避免扩展二进制过大
  # 原理：扩展只链接动态框架，二进制体积小（<1MB），Go 运行时在框架中动态加载
  # 注意：此框架必须嵌入到扩展的 Frameworks 目录中
  # ============================================================================
  XrayKit:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VPNPacketTunnel/XrayKit
        excludes:
          - "**/README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.client.xraykit
        PRODUCT_NAME: XrayKit
        # 桥接头文件配置：导入 Xray 核心 C API
        SWIFT_OBJC_BRIDGING_HEADER: VPNPacketTunnel/XrayKit/XrayKit-Bridging-Header.h
        # 头文件搜索路径：让编译器能找到 libxray.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/VPNPacketTunnel/Xray.xcframework/ios-arm64/Headers"
        # Go 静态库需要链接 resolv 库（DNS 解析）
        OTHER_LDFLAGS: "-lresolv"
        # 禁用 bitcode（Go 静态库不支持）
        ENABLE_BITCODE: NO
        # 动态框架不需要剥离符号（运行时需要）
        STRIP_INSTALLED_PRODUCT: NO
        DEAD_CODE_STRIPPING: NO
        # 禁用模块接口生成（桥接头文件不支持与模块接口一起使用）
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        ENABLE_MODULE_VERIFIER: NO
        SWIFT_ENABLE_LIBRARY_EVOLUTION: NO
        SWIFT_EMIT_MODULE_INTERFACE: NO
        SWIFT_EMIT_PRIVATE_MODULE_INTERFACE: NO
        # 确保动态框架被正确签名
        CODE_SIGN_STYLE: Automatic
    dependencies:
      # 链接 Xray 核心静态库（不嵌入，因为是静态库）
      - framework: VPNPacketTunnel/Xray.xcframework
        embed: false

  # ============================================================================
  # VPN 网络扩展 Target（PacketTunnelProvider）
  # 用途：提供系统级 VPN 隧道能力，支持 VLESS/VMess 等协议代理
  # 注意：此扩展在独立进程运行，有内存限制（约50MB）
  #       二进制必须小（<1MB），Go 核心放在 XrayKit 动态框架中
  # ============================================================================
  VPNPacketTunnel:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VPNPacketTunnel
        excludes:
          - "**/README.md"
          - "Xray.xcframework"
          - "XrayKit"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.client.vpn
        PRODUCT_NAME: VPNPacketTunnel
        INFOPLIST_FILE: VPNPacketTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: VPNPacketTunnel/VPNPacketTunnel.entitlements
        # 扩展二进制很小，不需要特殊链接参数
        # 禁用 bitcode
        ENABLE_BITCODE: NO
        # 剥离调试符号（减小体积）
        STRIP_INSTALLED_PRODUCT: YES
        STRIP_STYLE: all
        DEAD_CODE_STRIPPING: YES
        SWIFT_REFLECTION_METADATA_LEVEL: none
        # 运行路径搜索：让扩展能找到嵌入的动态框架
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      # 链接并嵌入 Xray 动态框架
      - target: XrayKit
        embed: true
    # 扩展不需要依赖主应用，它是独立运行的进程
    # 主应用通过 dependencies 嵌入此扩展
