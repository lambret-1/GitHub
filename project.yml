# ==============================================================================
# XcodeGen 项目配置文件
# 用途：通过 YAML 配置动态生成标准 Xcode 项目（.xcodeproj）
# 优势：避免手动维护 project.pbxproj 的复杂性和易出错性
# 工具：XcodeGen (https://github.com/yonaskolb/XcodeGen)
# 使用：xcodegen generate
# ==============================================================================

name: GitHub
options:
  bundleIdPrefix: com.github
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: GitHub/Info.plist
    DEVELOPMENT_ASSET_PATHS: "\"GitHub/Preview Content\""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    SWIFT_EMIT_LOC_STRINGS: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES

targets:
  GitHub:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: GitHub
        excludes:
          - "Preview Content"
      - path: GitHub/Preview Content
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.github.client
        PRODUCT_NAME: GitHub
        INFOPLIST_FILE: GitHub/Info.plist
    info:
      path: GitHub/Info.plist
      properties:
        CFBundleDisplayName: GitHub
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
