name: CI 基础设施检查

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bootstrap:
    name: 工具链与 XcodeGen 配置检查
    runs-on: macos-14
    steps:
      - name: 检出触发提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: 执行统一 Bootstrap Action
        uses: ./.github/actions/ci-bootstrap
