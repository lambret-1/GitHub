name: CI 基础设施检查

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bootstrap:
    name: 工具链与 XcodeGen 配置检查
    runs-on: macos-14
    steps:
      - name: 检出触发提交
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: 执行统一 Bootstrap Action
        uses: ./.github/actions/ci-bootstrap
      - name: 上传已验证的 Xcode 工程
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project-${{ github.run_id }}-${{ github.run_attempt }}
          path: GitHub.xcodeproj
          if-no-files-found: error
          retention-days: 1
