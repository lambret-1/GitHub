# ==============================================================================
# 工作流名称：生产构建流水线（Production Build Pipeline）
# 触发条件：仅 main 分支推送触发完整生产流水线
# 流水线职责：
#   1. 版本进位单元测试（质量门禁）
#   2. 版本号自动递增（三段式语义版本，补丁位0~9自动进位）
#   3. Xcode 编译（未签名，适配全能签导入标准）
#   4. 导出未签名 IPA 制品
#   5. 计算 IPA SHA256 哈希 + 生成制品元数据 JSON
#   6. 自动更新 README 顶部更新日志
#   7. 提交版本变更 + README 变更到仓库
#   8. 上传 IPA + 元数据作为 Artifacts
#   9. 自动清理过期 Artifacts（节约存储配额）
# 严格禁止：PR/其他分支触发本流水线
# ==============================================================================

name: 生产构建流水线

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 支持手动触发

# 并发控制：同一时间仅允许一个生产构建运行，新构建排队等待（不取消进行中的构建，
# 避免 Release 发布中途被截断导致制品不一致）
concurrency:
  group: production-build-main
  cancel-in-progress: false

# 全局环境变量（消除硬编码，便于统一维护）
env:
  PROJECT_NAME: GitHub
  SCHEME_NAME: GitHub
  XCODE_PROJECT: GitHub.xcodeproj
  INFO_PLIST_PATH: GitHub/Info.plist
  IPA_FILE_NAME: GitHub.ipa
  ARTIFACT_RETENTION_DAYS: 30
  DEPLOYMENT_TARGET: 15.0
  XCODEGEN_VERSION: "2.40.0"

jobs:
  # ============================================================================
  # Job 1：版本计算与单元测试（质量门禁，失败则终止整个流水线）
  # ============================================================================
  version-bump:
    name: 版本计算与单元测试
    runs-on: macos-14
    outputs:
      version_new: ${{ steps.bump.outputs.version_new }}
      version_old: ${{ steps.bump.outputs.version_old }}
      git_commit_short: ${{ steps.commit_info.outputs.commit_short }}
      build_start_time: ${{ steps.time.outputs.start_time }}
    steps:
      # Step 1: 检出代码
      # 使用默认的 GITHUB_TOKEN 进行 checkout，避免 REPO_ADMIN_TOKEN 过期导致 checkout 失败
      # 后续 git push 步骤会单独配置 REPO_ADMIN_TOKEN
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于git log和commit信息

      # Step 2: 记录构建开始时间
      - name: 记录构建开始时间
        id: time
        run: |
          echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "构建开始时间戳: $(date +%s)"

      # Step 3: 获取Git Commit短哈希
      - name: 获取Git Commit信息
        id: commit_info
        run: |
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          echo "commit_short=${COMMIT_SHORT}" >> "$GITHUB_OUTPUT"
          echo "当前Commit短哈希: ${COMMIT_SHORT}"

      # Step 4: 执行版本进位单元测试（质量门禁，失败立即终止）
      - name: 执行版本进位单元测试
        id: unit_test
        run: |
          echo "=========================================="
          echo "开始执行版本进位逻辑单元测试..."
          echo "=========================================="
          chmod +x scripts/test-bump-version.sh
          bash scripts/test-bump-version.sh
          TEST_EXIT_CODE=$?
          if [ ${TEST_EXIT_CODE} -ne 0 ]; then
            echo "::error::版本进位单元测试失败，退出码: ${TEST_EXIT_CODE}"
            exit ${TEST_EXIT_CODE}
          fi
          echo "::notice::版本进位单元测试全部通过"

      # Step 5: 执行版本号自动递增
      - name: 执行版本号自动递增
        id: bump
        run: |
          echo "=========================================="
          echo "开始执行版本号自动递增..."
          echo "=========================================="
          chmod +x scripts/bump-version.sh
          bash scripts/bump-version.sh
          BUMP_EXIT_CODE=$?
          if [ ${BUMP_EXIT_CODE} -ne 0 ]; then
            echo "::error::版本号递增失败，退出码: ${BUMP_EXIT_CODE}"
            exit ${BUMP_EXIT_CODE}
          fi

      # Step 6: 读取递增后的版本号（用于后续步骤传递）
      - name: 读取新版本号
        id: read_version
        run: |
          NEW_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${{ env.INFO_PLIST_PATH }}")
          echo "version_new=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "递增后版本号: ${NEW_VERSION}"

      # Step 7: 提交版本变更到仓库（Info.plist）
      - name: 提交版本变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 检查是否有变更
          if git diff --quiet "${{ env.INFO_PLIST_PATH }}"; then
            echo "::warning::Info.plist 无变更，跳过提交"
          else
            git add "${{ env.INFO_PLIST_PATH }}"
            NEW_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${{ env.INFO_PLIST_PATH }}")
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            git commit -m "chore(release): 版本号自动递增至 v${NEW_VERSION} [skip ci]" -m "触发Commit: ${COMMIT_SHORT} | 构建时间: ${BUILD_TIME} | 触发方式: GitHub Actions 生产构建流水线"
            # 使用 REPO_ADMIN_TOKEN 配置 remote URL，绕过分支保护
            git remote set-url origin https://x-access-token:${{ secrets.REPO_ADMIN_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin main
            echo "::notice::版本变更已提交并推送到 main 分支"
          fi

  # ============================================================================
  # Job 2：Xcode 编译与 IPA 导出（依赖版本计算Job完成）
  # ============================================================================
  build-ipa:
    name: Xcode编译与IPA导出
    runs-on: macos-14
    needs:
